_ > nanoagent.plugin.v0001.ManifestConfig:
id: stat-pick
name: Stat Pick
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_question:
    description: Read a case's question and the column of readings it is about, without the readings themselves
  summarise:
    description: Work out one named summary of a case's column, whether or not it is the one that answers the question
  solution:
    description: Read a case's readings and the summary that answers its question, which no task tool returns

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  answer-question:
    description: Choose which summary of a column answers a question asked in words, and give its value
    runner: decide
    tools: [read_question, summarise]
    reference: solution
    instructions: |-
      Read the case's question with read_question. It gives the question in words and the column it is about; the readings themselves are never shown, so the value cannot be worked out by hand.
      Decide which one of the eight summaries the question is asking for. The question describes the situation, and the situation is what settles it: a figure that must not be dragged about by a few extreme readings is the median rather than the mean; the size that occurs most often is the mode; how far readings sit from their own average is the spread; how much there was altogether is the total.
      Call summarise for the case, that column, and the summary you chose. Then give the case as the task gave it, the summary you chose, and the value exactly as summarise returned it.
      The choice and the value are judged separately. Choosing the summary is the whole of the decision; choosing the right one and then giving a value that is not its own counts as half an answer.
